<!DOCTYPE html>
<html>
<head>
    <title>css media types and media queries</title>
    <style>
        body {
            background-color: rgb(230, 173, 214);
        }
        @media screen and (max-width:1000px) {
            body {
                background-color: rgb(174, 144, 238);
            }
        }
        @media print {
            body {
                background-color: rgb(230, 21, 21);
                color: black;
            }
        }
    </style>
</head>
<body>
   <h1>Resize the browser or try to print this page</h1>
</body>
</html>
