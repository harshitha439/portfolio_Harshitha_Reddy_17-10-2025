<!DOCTYPE html>
<html>
    <head>
        <title> Flex vs Grid</title>
        <style>
            .flex-container {
                display:flex;
                gap:10px;
                border:2px solid blue;
                padding:10px;
                width: 30%;
            }
            .flex-container div {
                background-color: lightpink;
                padding: 20px;
                text-align: center;
                width: 30%;
            }
            .grid-container {
                display: grid;
                gap: 10px;
                border: 2px solid greenyellow;
                padding: 10px;
                grid-template-columns: repeat(3, 3fr);
                margin-top: 20px;
                width: 30%;
            }
            .grid-container div {
                background-color: aqua;
                padding:20px;
                text-align: center;
                width: 30%;
            }
          </style>
    </head>
    <body>
        <h2>
            Flex Box Example 
        </h2>
        <div class = "flex-container">
            <div> 1 </div>
              <div> 2 </div>
                <div> 3 </div>
        </div>
        <h2> Grid Example </h2>
        <div class = "grid-container" >
              <div> 1 </div>
                <div> 2 </div>
                  <div> 3 </div>
                    <div> 4 </div>
                      <div> 5 </div>
                        <div> 6 </div>
        </div>
    </body>
</html>
