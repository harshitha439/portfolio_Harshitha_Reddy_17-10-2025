<!DOCTYPE html>
<html>
    <head>
        <style>
            button {
                background-color: blueviolet;
                color: white;
                border: none;
                padding: 15px;
                transition: background-color 0.5s,transform 0.5s;
            }
            button:hover {
                background-color: brown;
                transform: scale(1,2);
            }
        </style>
    </head>
    <body>
        <button> Harshitha </button>
    </body>
</html>
