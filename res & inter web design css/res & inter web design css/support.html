<!DOCTYPE html>
<html>
    <head>
        <style>
            .box{
                background-color: aqua;
                color: azure;
                padding: 20px;
            }
            @supports(display:grid){
                .box {
                    display:grid;
                    place-items: center;
                    background-color: chocolate;
                }
            }
        </style>
    </head>
    <body>
        <div class = "box">Support</div>
    </body>
</html>
