<!DOCTYPE html>
<html>
    <head>
        <style>
            .box{
                width:100px;
                height:100px;
                background-color: blueviolet;
                position: relative;
                animation: moveBox 4s infinite;
            }
            @keyframes moveBox {
                0% {left:0px;top:0px;background-color: purple;}
                25% {left:200px;top:0px;background-color: aqua;}
                50% {left:200px;top:200px;background-color: rgb(0, 128, 64);}
                100%{left:0px;top:0px;background-color: chartreuse;}
            }
        </style>
    </head>
    <body>
        <div class = "box">Harshitha</div>
    </body>
</html>
