<!DOCTYPE html>
<html>
    <head>
        <style>
            button {
                background-color: aquamarine;
            }
        </style>
    </head>
    <body>
<h2> Click event  </h2>
         <button onclick = "showMessage()" > Click
     </button>
         <p id="message"></p>
   <script>
        function showMessage() {
               document.getElementById("message").innerHTML = "You clicked the button";
          }
        </script>
      </body>
</html>
