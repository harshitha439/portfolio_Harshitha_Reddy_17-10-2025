<!DOCTYPE html>
<html>
<head>
    <title>Form</title>
    <style>
      .body{
        background-color: aqua;
      }
      .error {
        color: blue;
        font-weight: bold;
      }
      .success{
        color: blueviolet;
        font-weight: bold;
      }
      .invalid{
        border: 2px solid red;
      }
      .valid{
        border: 2px solid green;
      }
    </style>
</head>
<body style="background-color: lavenderblush; text-align: center;">
    <h1 style="text-align: center; color: black;"><b>Student Registration Form</b></h1><br>
    <form id="studentForm">
        <fieldset>
            <legend style="font-weight: bold;">Basic Information</legend>
            <label class="p" for="photo">Upload Photo:</label>
            <input type="file" id="photo" name="UploadPhoto"><br><br>
            <label class="fn" for="name">Full Name:</label>
            <input type="text" id="name" name="FullName" placeholder="Full Name"><br><br>
            <label class="e" for="email">Email-Id:</label>
            <input type="email" id="email" name="email" placeholder="Enter your college email id"><br><br>
            <label class="p" for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password"><br><br>
        </fieldset>
        <label class="g">Gender:</label>
        Male <input type="radio" name="gender" value="Male">
        Female <input type="radio" name="gender" value="Female"><br><br>

        <label class="dob" for="dob">Date of birth:</label>
        <input type="date" id="dob" name="DOB"><br><br>

        <label class="sc">Select Branch:</label>
        <input type="radio" name="branch" value="CSE"> CSE
        <input type="radio" name="branch" value="ECE"> ECE
        <input type="radio" name="branch" value="EEE"> EEE
        <input type="radio" name="branch" value="MECH"> MECH<br><br>

        <label class="h" for="city">City:</label>
        <select id="city" name="city">
            <option value="">--Select City--</option>
            <option>Hyderabad</option>
            <option>Bangalore</option>
            <option>Chennai</option>
            <option>Mumbai</option>
        </select><br><br>

        <label class="a" for="address">Address:</label>
        <textarea id="address" name="address" rows="1" cols="25"></textarea><br><br>
        <input type="submit" id="submit" value="Submit">
        <input type="reset" id="reset" value="Reset">
    </form>
    <p id="message"></p>
    <script>
        document.getElementById("studentForm").addEventListener("submit", submitform);
        function submitform(event) {
            event.preventDefault();   
            let  msg = document.getElementById("message");
            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value;
            let dob = document.getElementById("dob").value;
            let gender = document.querySelector('input[name="gender"]:checked');
            let branch = document.querySelector('input[name="branch"]:checked');
            let city = document.getElementById("city").value;
            let photo = document.getElementById("photo").value;
            let address = document.getElementById("address").value.trim();
            if (name.length < 3) {
                msg.innerHTML = "Name must be at least 3 characters";
                msg.className = "error";
                return;
            }
            if (email === "") {
                msg.innerHTML = "Email is required!";
                msg.className = "error";
                return;
            }

            if (password.length < 6) {
                msg.innerHTML = "Password must be at least 6 characters";
                msg.className = "error";
                return;
            }

            if (dob === "") {
                msg.innerHTML = "DOB is required";
                msg.className = "error";
                return;
            }

            if (!gender) {
                msg.innerHTML = "Please select a gender";
                msg.className = "error";
                return;
            }

            if (!branch) {
                msg.innerHTML = "Branch is required";
                msg.className = "error";
                return;
            }

            if (city === "") {
                msg.innerHTML = "City is required";
                msg.className = "error";
                return;
            }

            if (photo === "") {
                msg.innerHTML = "Photo is required";
                msg.className = "error";
                return;
            }

            if (address.length < 5) {
                msg.innerHTML = "Address must be at least 5 characters";
                msg.className = "error";
                return;
            }

            msg.innerHTML = "Details submitted successfully!";
            msg.className = "success";
        }
    </script>
</body>
</html>
