<!DOCTYPE html>
<html>
<head>
    <title>Online Course Portal</title>
</head>
<body style="background-color: lavenderblush;">
    <h1 style="text-align: center; color: black;"><b>Student Registration Form for Online Course Portal</b></h1><br>
    <form>
        UploadPhoto:
        <input type="file" id="UploadPhoto" name="UploadPhoto"><br><br>
        FullName:
        <input type="text" id="First_Name" name="FirstName" placeholder="FirstName"> <input type="text" id="Middle_Name" name="Middle_Name" placeholder="Middle Name" > <input type="text" id="Last_Name" name="Last_Name" placeholder="Last Name"><br><br>
        Email-Id:
        <input type="email" id="email" name="email" placeholder="Enter your college email id"> <br><br>
        Password:
        <input type="password" id="password" name="password" placeholder="Enter your password"><br><br>
        Gender:
        Male<input type="radio" id="Male" name="Male" value="Male"> Female<input type="radio" id="Female" name="Female" value="Female"><br><br>
        Date of birth:
        <input type="date" id="DOB" name="DOB" ><br><br>
        Select Course:
        <select>
            <option>B.Tech</option>
            <option>MBA</option>
            <option>BBA</option>
            <option>M.Tech</option>
        </select><br><br>
        Hobbies:<br>
        Reading<input type="checkbox" id="Reading" name="Reading" value="Reading"><br>
        Sports<input type="checkbox" id="Sports" name="Sports" value="Sports"><br>
        Coding<input type="checkbox" id="Coding" name="Coding" value="Coding"><br>
        Music<input type="checkbox" id="Music" name="Music" value="Music"><br><br>
        Address:
        <textarea rows="1" cols="25"></textarea><br><br>
        <input type="submit" id="submit" name="submit" value="submit">
        <input type="reset" id="reset" name="reset" value="reset">
        

    </form>

</body>
</html>
