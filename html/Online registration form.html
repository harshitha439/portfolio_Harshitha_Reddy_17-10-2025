<!DOCTYPE html>
<html>
    <head>
        <title>Online Course Registration </title>
        <body style = "background-color: aqua;">
         <h1> <b> Course Registration </b></h1>
         <form>
            <lable for = "Full Name"> Full Name : </lable>
           <input type = "text" id = "Name" name = "First name" placeholder="Enter your first name">
            <input type = "text" id = "Name" name = "last name" placeholder ="Enter your last name">
         </br> </br>
            <lable  > Email  </lable>
            <input type = "Email" id = "Email" name = "Email"> </br> </br>

              <input type = "Password" id = "Password" name = "Password"> </br> </br> 
               <lable> Gender : </lable>
             <lable> Male </lable>
              <input type = "radio" id = "Male" name = "Gender" value = "Male">
               <lable> Female </lable>
              <input type = "radio" id = "Female" name = "Gender" value = "Female">

             <label> Date of Birth :</label>
               <input type = "date" id = "Date of Birth" name = "Date of Birth" >
                </br> </br>

             <select>
                <option> B-tech </option>
                <option> BBA </option>

                <option> M.Tech </option>
             </select>
             </br> </br> 
             <label> Hobbies :</label>

            <input type = "checkbox" id = "Reading" name = "Hobbies" value = "Reading" >     
              <lable> Sports :</lable>
            <input type = "checkbox" id = "Sports" name = "Hobbies" value = "Sports">
            <lable> Coding : </lable>

            <lable> Music : </lable>
            <input type = "checkbox" id = "Music" name = "Hobbies" value = "Music">
            </br> </br>
               <label> Address :</label>
                <textarea rows = "1" cols = "4"> </textarea>
                 </br> </br>
                <lable> Upload Profile Pic : </lable>
                 <input type = "file" id = "Pic" name = "Profile Pic" >
                  </br> </br>
                 <input type = "Submit" value = "Submit">
                 <input type = "reset" value = "reset">
         </form>
        </body>
    </head>
</html>
