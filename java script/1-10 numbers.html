<!DOCTYPE html>
<html>
    <head>
        <title>1 to 10 numbers</title>
    </head>
    <body>
        <h1>1 to 10 numbers</h1>
        
        <script>
            let n=10;
            for(let i=1;i<=n;i++)
        {
            document.write(i+"<br>");
        }
            
        </script>

    </body>
</html>
