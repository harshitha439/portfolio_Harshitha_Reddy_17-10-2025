<!DOCTYPE html>
<html>
    <body>
        <h2>Javasript HTML DOM</h2>
        <p>Finding HTML Elements by Class Name</p>
        <p class="intro">Hello World</p>
        <p class="intro">This example demonstates the <b>getElementsByClassName</b>method.</p>
        <p id="demo"></p>
        <script>
            const x = document.getElementsByClassName("intro");
            document.getElementById("demo").innerHTML="The text in first paragraph(index 0) is :"+ x[0].innerHTML;
        </script>
    </body>
</html>
