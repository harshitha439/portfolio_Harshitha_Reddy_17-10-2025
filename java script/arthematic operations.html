<!DOCTYPE html>
<html>
    <head>
        <title>Arithmetic operations </title>
    </head>
    <body>
        <h1>Arithmetic operations</h1>
        a=10<br>b=20<br>
        
        <script>
            let a=10;
            b=20;
            add=a+b;
            subtract=a-b;
            product=a*b;
            quotient=a%b;
            document.write("sum="+add+"<br>",subtract+"<br>",product+"<br>",quotient+"<br>");
        </script>

    </body>
</html>
