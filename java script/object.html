<!DOCTYPE html>
<html>
    <head>
        <title>Object </title>
    </head>
    <body>
        <h1>Object-Student</h1>
        
        <script>
            let student={
                name:"harshitha",
                age:18,
                grade:'A',
            }
           
            document.write(student.name+"<br>");
            document.write(student["age"]+"<br>");
            document.write(student.grade);
        </script>

    </body>
</html>
