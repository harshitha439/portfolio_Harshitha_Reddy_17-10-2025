<!DOCTYPE html>
<html>
    <head>
        <title>Function</title>
    </head>
    <body>
        <h1>Function</h1>
        
        <script>
            function greet(name)
            {
                return "Hello ,"+ name;
            }
            document.write(greet("Harshitha"));
        </script>

    </body>
</html><!DOCTYPE html>
<html>
    <head>
        <title>Arrow function</title>
    </head>
    <body>
        <h1>Arrow function</h1>
        
        <script>
            const greet=(name) =>"hello, "+name;
           
            document.write (greet("Harshitha"));
        </script>

    </body>
</html>
