<!DOCTYPE html>
<html>
    <head>
        <title>Even or Odd Number</title>
    </head>
    <body>
        <h1>Even or Odd Number</h1>
        
        <script>
            let n=10;
            if(n%2==0)
        {
            document.write("even number");
        }
        else{
            document.write("odd number");
        }
        </script>

    </body>
</html>
