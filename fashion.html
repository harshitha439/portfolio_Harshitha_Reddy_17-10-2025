<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clothing Store Catalog</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      padding-top: 70px;
    }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      background-color: #222;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      z-index: 1000;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    header h1 {
      font-size: 1.5rem;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 1rem;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #ff9800;
    }

    .product-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }

    article.product-card {
      background-color: white;
      border-radius: 10px;
      overflow: hidden;
      width: 200px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    article.product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .product-card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      transition: transform 0.3s;
    }

    .product-card img:hover {
      transform: scale(1.05);
    }

    .product-info {
      padding: 15px;
      text-align: center;
    }

    .product-info h2 {
      font-size: 1.1rem;
      margin-bottom: 10px;
    }

    .product-info p {
      color: #777;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }

    .product-info span {
      font-weight: bold;
      color: #222;
    }

    @media (max-width: 768px) {
      .product-card {
        width: 45%;
      }

      header h1 {
        font-size: 1.2rem;
      }

      nav a {
        font-size: 0.9rem;
        margin-left: 15px;
      }
    }

    @media (max-width: 480px) {
      .product-card {
        width: 90%;
      }

      header {
        flex-direction: column;
        align-items: flex-start;
      }

      nav {
        margin-top: 10px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Fashion Hub</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">Men</a>
      <a href="#">Women</a>
      <a href="#">Kids</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="product-grid">
    <article class="product-card">
      <img src="html/images/OIP.jpg" alt="T-Shirt">
      <div class="product-info">
        <h2>Classic T-Shirt</h2>
        <p>Comfortable cotton t-shirt</p>
        <span>$25</span>
      </div>
    </article>

    <article class="product-card">
      <img src="html/images/OIP.webp" alt="Jeans">
      <div class="product-info">
        <h2>Blue Jeans</h2>
        <p>Stylish slim fit</p>
        <span>$40</span>
      </div>
    </article>

    <article class="product-card">
      <img src="html/images/OIP (1).webp" alt="Jacket">
      <div class="product-info">
        <h2>Leather Jacket</h2>
        <p>Trendy and warm</p>
        <span>$120</span>
      </div>
    </article>

    <article class="product-card">
      <img src="html/images/OIP (2).webp" alt="Sneakers">
      <div class="product-info">
        <h2>Casual Sneakers</h2>
        <p>Comfortable walking shoes</p>
        <span>$60</span>
      </div>
    </article>

    <article class="product-card">
      <img src="html/images/OPAC.webp" alt="Dress">
      <div class="product-info">
        <h2>Evening Dress</h2>
        <p>Elegant cocktail dress</p>
        <span>$80</span>
      </div>
    </article>
  </section>

</body>
</html>
