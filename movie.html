<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Finder App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
    }
    h1 {
      color: #38bdf8;
    }
    .search-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input {
      padding: 10px;
      width: 250px;
      border-radius: 5px;
      border: none;
      outline: none;
    }
    button {
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      background-color: #2563eb;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    .movie-card {
      background-color: #1e293b;
      padding: 20px;
      border-radius: 10px;
      width: 300px;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    .movie-card img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .error {
      color: #f87171;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>🎥 Movie Finder App</h1>
  <div class="search-container">
    <input type="text" id="movieInput" placeholder="Enter movie title">
    <button id="searchBtn">Search</button>
  </div>
  <div id="movieContainer"></div>
  <p class="error" id="errorMsg"></p>

  <script>
    const API_KEY = "e01bb3e2"; 
    const searchBtn = document.getElementById("searchBtn");
    const movieInput = document.getElementById("movieInput");
    const movieContainer = document.getElementById("movieContainer");
    const errorMsg = document.getElementById("errorMsg");

    async function fetchMovie(title) {
      try {
        errorMsg.textContent = "";
        movieContainer.innerHTML = "<p>Loading...</p>";
        const response = await fetch(`https://www.omdbapi.com/?t=${encodeURIComponent(RRR)}&apikey=${e01bb3e2}`);
        const data = await response.json();
        if (data.Response === "False") {
          throw new Error("Movie not found. Please check the title.");
        }
        movieContainer.innerHTML = `
          <div class="movie-card">
            <img src="${data.Poster !== "N/A" ? data.Poster : "https://via.placeholder.com/300x450?text=No+Image"}" alt="Poster not found">
            <h2>${data.Title}</h2>
            <p><strong>Year:</strong> ${data.Year}</p>
            <p><strong>Genre:</strong> ${data.Genre}</p>
            <p><strong>Rating:</strong> ${data.imdbRating}</p>
          </div>
        `;
        localStorage.setItem("lastMovie", title);
      } catch (error) {
        movieContainer.innerHTML = "";
        errorMsg.textContent = error.message;
      }
    }

    window.addEventListener("load", () => {
      const lastSearch = localStorage.getItem("lastMovie");
      if (lastSearch) {
        movieInput.value = lastSearch;
        fetchMovie(lastSearch);
      }
    });

    searchBtn.addEventListener("click", () => {
      const title = movieInput.value.trim();
      if (title) fetchMovie(title);
      else errorMsg.textContent = "Please enter a movie title.";
    });
  </script>
</body>
</html>
