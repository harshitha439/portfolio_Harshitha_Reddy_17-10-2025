<!DOCTYPE html>
<html>
    <head>
        <title>Changing the value of an Attribute </title>
    </head>
    <body>
          <h2>HTML Attribute</h2>
          <img id="image" src="Windmill.gif" width="160" height="120">
          <script>
            document.getElementById("image").src = "Landscape.jpg";
          </script>
          <p>The original image was a gif , but the script changed it to jpg format file </p>
    </body>
</html>
