<!DOCTYPE html>
<html>
    <head>
       <title>DOM 1</title>
    </head>
    <body>
        <h2>Javascript HTML DOM</h2>
        <p id="intro">Finding HTML Elements by Id</p>
        <p>This example demonstrates the<b>getElementById</b>method.</p>
        <p id="demo"></p>
        <script>
            const element = document.getElementById("demo").innerHTML="The text from the intro paragraph is:"+element.innerHTML;
        </script>
    </body>
</html>
