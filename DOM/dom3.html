<!DOCTYPE html>
<html>
    <head>
       <title>DOM 3</title>
    </head>
    <body>
        <h2>Javascript HTML DOM</h2>
        <p id="intro">Finding HTML Elements by Class Name</p>
        <p>"Hello, World!"</p>
        <p>This example demonstrates the <b>getElementByClassName</b> method.</p>
        <p id="demo"></p>
        <script>
            const x = document.getElementsByClassName("intro");
            document.getElementById("demo").innerHTML='The first paragraph (index 0) with class:"intro" is:'+x[0].innerHTML;
        </script>
    </body>
</html>
