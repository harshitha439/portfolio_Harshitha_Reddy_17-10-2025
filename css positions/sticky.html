<!DOCTYPE html>
<html>
    <head>
        <style>
            .x{ 
                position: sticky;
                top: 20px;
                left: 30px;
                background-color: chartreuse;
            }
            .y{
                position: relative;
                height : 200px;
                background-color: cornflowerblue;
            }
        </style>
    </head>
    <body>
        <h2> Sticky</h2>
        <div class = "y">
            <div class = "x">This is STICKY</div>
            <p>
                scroll inside the page - I stick untill its section ends
            </p>
        </div>
    </body>
</html>
