<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Save The Planet | NGO Campaign</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: 'Poppins', sans-serif;
  color: white;
  height: 100vh;
  overflow-x: hidden;
}
header {
  position: fixed;
  top: 0;
  width: 100%;
  background: rgba(0, 50, 0, 0.7);
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 40px;
  z-index: 10;
}
header h1 {
  font-size: 1.5rem;
}
nav a {
  color: white;
  text-decoration: none;
  margin: 0 15px;
  font-weight: 500;
}
nav a:hover {
  color: #aef1ae;
}
.hero {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  background-size: cover;
  background-position: center;
  animation: slideshow 15s infinite linear;
}
@keyframes slideshow {
  0%   { background-image: url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee'); }
  33%  { background-image: url('https://images.unsplash.com/photo-1501785888041-af3ef285b470'); }
  66%  { background-image: url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e'); }
  100% { background-image: url('https://images.unsplash.com/photo-1500534314209-a26db0f5b9a5'); }
}
.content {
  background: rgba(0, 0, 0, 0.4);
  padding: 40px;
  border-radius: 15px;
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: 600px;
}
.content h2 {
  font-size: 2.5rem;
  margin-bottom: 15px;
}
.content p {
  font-size: 1.1rem;
  margin-bottom: 20px;
}
button {
  background-color: #2ecc71;
  border: none;
  color: white;
  padding: 12px 25px;
  border-radius: 25px;
  cursor: pointer;
  transition: 0.3s;
}
button:hover {
  background-color: #27ae60;
}
footer {
  background: rgba(0, 50, 0, 0.8);
  text-align: center;
  padding: 15px;
  position: relative;
  bottom: 0;
}
@media (max-width: 768px) {
  header {
    flex-direction: column;
    padding: 10px;
  }
  nav a {
    margin: 5px;
    display: inline-block;
  }
  .content h2 {
    font-size: 1.8rem;
  }
  .content p {
    font-size: 1rem;
  }
}
@media (max-width: 480px) {
  .content {
    padding: 25px;
  }
  .content h2 {
    font-size: 1.5rem;
  }
  button {
    padding: 10px 20px;
  }
}
</style>
</head>
<body>
  <header>
    <h1>🌿 Save The Planet</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Projects</a>
      <a href="#">Join Us</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <div class="content">
      <h2>Together for a Greener Future</h2>
      <p>Join our mission to protect nature, reduce pollution, and create a sustainable planet for generations to come.</p>
      <button>Get Involved</button>
    </div>
  </section>

  <footer>
    <p>© 2025 Save The Planet NGO | Designed with ❤️ for a better Earth</p>
  </footer>
</body>
</html>
